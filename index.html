  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 28%, rgba(168, 74, 255, .20), transparent 28%),
        radial-gradient(circle at 10% 85%, rgba(100, 40, 180, .14), transparent 28%),
        linear-gradient(145deg, #030107 0%, #10051d 45%, #05010b 100%);
      color: #fff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(rgba(185, 103, 255, .18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(185, 103, 255, .18) 1px, transparent 1px);
      background-size: 74px 74px;
      mask-image: linear-gradient(to bottom, transparent, black 18%, black 85%, transparent);
    }

    .page {
      width: min(100%, 860px);
      margin: auto;
      padding: 46px 22px 54px;
      position: relative;
    }

    .glow-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c56cff;
      box-shadow: 0 0 18px #b94cff, 0 0 35px rgba(184, 73, 255, .7);
      animation: pulse 2.8s ease-in-out infinite;
    }
    .dot1 { left: 9%; top: 22%; }
    .dot2 { right: 10%; top: 52%; animation-delay: .9s; }
    .dot3 { left: 17%; bottom: 14%; animation-delay: 1.6s; }

    @keyframes pulse {
      0%,100% { transform: scale(.75); opacity: .65; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .hero {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .orb {
      width: min(72vw, 420px);
      height: min(72vw, 420px);
      margin: 20px auto 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background:
        radial-gradient(circle, #160a25 0 55%, #11061c 56% 100%);
      border: 10px solid #bf55ff;
      box-shadow:
        0 0 0 9px rgba(155, 58, 218, .45),
        0 0 0 25px rgba(126, 38, 190, .24),
        0 0 0 44px rgba(110, 30, 170, .12),
        0 0 48px rgba(182, 69, 255, .85),
        inset 0 0 55px rgba(164, 56, 230, .22);
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      border: 2px solid rgba(186, 78, 255, .35);
    }

    .orb::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      top: 7%;
      left: 4%;
      border-radius: 50%;
      background: #e4a7ff;
      box-shadow: 0 0 18px #c45cff;
    }

    .orb-text {
      font-size: clamp(34px, 9vw, 68px);
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(48px, 12vw, 86px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -3px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(178, 69, 255, .25);
    }

    h1 span {
      background: linear-gradient(90deg, #ffffff 0%, #e7d5ff 42%, #bf55ff 72%, #f08cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 18px 0 28px;
      font-size: clamp(18px, 4.3vw, 28px);
      color: #eee8f5;
      letter-spacing: .2px;
    }

    .tagline b {
      color: #c968ff;
      margin: 0 8px;
    }

    .malayalam-copy {
      max-width: 650px;
      margin: -10px auto 0;
      padding: 0 10px;
      color: #eee8f5;
      font-size: clamp(15px, 3.8vw, 20px);
      line-height: 1.45;
      text-align: center;
    }

    .join {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-height: 72px;
      width: min(100%, 650px);
      padding: 18px 28px;
      border-radius: 22px;
      color: #fff;
      text-decoration: none;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 800;
      background: linear-gradient(100deg, #9b31e8, #6525d6);
      border: 2px solid #d978ff;
      box-shadow:
        0 0 0 5px rgba(143, 42, 213, .12),
        0 0 35px rgba(162, 48, 234, .58);
      transition: transform .18s ease, box-shadow .18s ease;
      margin-bottom: 42px;
    }

    .join:hover, .join:active {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 0 45px rgba(190, 72, 255, .75);
    }

    .telegram-icon {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      font-size: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .card {
      min-height: 240px;
      padding: 24px 14px 22px;
      border: 2px solid rgba(173, 53, 235, .8);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(22, 8, 35, .88), rgba(7, 2, 13, .94));
      box-shadow: inset 0 0 30px rgba(142, 45, 190, .10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      border: 3px solid #c45cff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 32px;
      margin-bottom: 18px;
      box-shadow: 0 0 18px rgba(191, 75, 255, .38);
    }

    .number {
      font-size: clamp(31px, 6vw, 43px);
      font-weight: 800;
      margin-bottom: 10px;
    }

    .label {
      color: #d77bff;
      font-size: 21px;
      line-height: 1.1;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #8f8299;
      font-size: 13px;
    }

    @media (max-width: 620px) {
      .page { padding: 28px 16px 42px; }
      .orb { margin-top: 12px; border-width: 8px; }
      h1 { letter-spacing: -2px; }
      .join { min-height: 64px; border-radius: 19px; margin-bottom: 28px; }
      .cards { gap: 11px; }
      .card { min-height: 205px; padding: 18px 7px; border-radius: 22px; }
      .icon { width: 58px; height: 58px; font-size: 25px; margin-bottom: 13px; }
      .number { font-size: 28px; }
      .label { font-size: 17px; }
    }

    @media (max-width: 390px) {
      .cards { grid-template-columns: 1fr; }
      .card { min-height: 150px; }
      .icon { margin-bottom: 8px; }
    }
  </style>
</head>

  </main>

</html>
